<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsData.io 日语新闻诊断测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .content {
      padding: 30px;
    }

    .test-section {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 25px;
      border-left: 5px solid #007bff;
    }

    .test-section h2 {
      color: #007bff;
      margin-bottom: 15px;
      font-size: 1.4em;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      margin: 5px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .results {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      margin-top: 15px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e9ecef;
    }

    .status-success {
      color: #28a745;
      font-weight: bold;
    }

    .status-error {
      color: #dc3545;
      font-weight: bold;
    }

    .status-info {
      color: #17a2b8;
      font-weight: bold;
    }

    .warning {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      color: #856404;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }

    .news-card {
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .news-title {
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .news-meta {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 8px;
    }

    .language-tag {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8em;
      margin-right: 5px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>🗾 NewsData.io 日语新闻诊断测试</h1>
      <p>详细分析API在不同语言设置下的响应情况</p>
    </div>

    <div class="content">
      <div class="warning">
        <strong>⚠️ 注意：</strong>请确保你的API Key有效且有足够的额度。测试过程中会进行多次API调用。
      </div>

      <div class="test-section">
        <h2>🔧 API配置测试</h2>
        <button class="btn" onclick="testApiKey()">1. 测试API Key有效性</button>
        <button class="btn" onclick="testEnglishNews()">2. 测试英语新闻 (en)</button>
        <button class="btn" onclick="testJapaneseNews()">3. 测试日语新闻 (ja)</button>
        <button class="btn" onclick="testMixedLanguage()">4. 测试混合语言 (ja,en)</button>
        <button class="btn" onclick="testDifferentCategories()">5. 测试不同分类</button>
        <div id="apiResults" class="results"></div>
      </div>

      <div class="test-section">
        <h2>🌏 语言支持分析</h2>
        <button class="btn" onclick="testLanguageSupport()">测试所有支持的语言</button>
        <button class="btn" onclick="testJapaneseCategories()">测试日语各分类新闻</button>
        <div id="languageResults" class="results"></div>
      </div>

      <div class="test-section">
        <h2>📊 结果对比分析</h2>
        <button class="btn" onclick="compareLanguageResults()">对比语言结果</button>
        <button class="btn" onclick="analyzeProblem()">分析问题原因</button>
        <div id="analysisResults" class="results"></div>
      </div>

      <div class="test-section">
        <h2>💡 解决方案建议</h2>
        <div id="solutions">
          <h3>可能的解决方案：</h3>
          <ol>
            <li><strong>API配额检查：</strong>确认API Key的配额和限制</li>
            <li><strong>语言代码验证：</strong>确认'ja'是否为正确的日语语言代码</li>
            <li><strong>分类支持：</strong>确认所选分类是否支持日语内容</li>
            <li><strong>降级策略：</strong>先尝试日语，失败后自动切换到英语</li>
            <li><strong>混合语言优化：</strong>调整language参数的顺序和格式</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = 'pub_afe616564d5843a5af76c5e4af882a2c';
    const BASE_URL = 'https://newsdata.io/api/1/news';

    function log(elementId, message, type = 'info') {
      const element = document.getElementById(elementId);
      const timestamp = new Date().toLocaleTimeString('ja-JP');
      const className = `status-${type}`;
      element.innerHTML += `<span class="${className}">[${timestamp}]</span> ${message}\n`;
      element.scrollTop = element.scrollHeight;
    }

    function clearLog(elementId) {
      document.getElementById(elementId).innerHTML = '';
    }

    async function makeApiRequest(params) {
      const url = new URL(BASE_URL);
      url.searchParams.append('apikey', API_KEY);

      Object.keys(params).forEach(key => {
        url.searchParams.append(key, params[key]);
      });

      const startTime = Date.now();
      try {
        const response = await fetch(url.toString());
        const endTime = Date.now();
        const data = await response.json();

        return {
          success: response.ok,
          status: response.status,
          data: data,
          responseTime: endTime - startTime,
          url: url.toString()
        };
      } catch (error) {
        return {
          success: false,
          error: error.message
        };
      }
    }

    async function testApiKey() {
      clearLog('apiResults');
      log('apiResults', '🔍 测试API Key有效性...', 'info');

      const result = await makeApiRequest({ language: 'en', size: 1 });

      if (result.success) {
        log('apiResults', `✅ API Key有效！状态: ${result.status}`, 'success');
        log('apiResults', `📊 响应时间: ${result.responseTime}ms`, 'info');
        if (result.data.status === 'success') {
          log('apiResults', `📰 可获取新闻数量: ${result.data.totalResults}`, 'success');
        }
      } else {
        log('apiResults', `❌ API Key无效或出错: ${result.error}`, 'error');
      }
    }

    async function testEnglishNews() {
      clearLog('apiResults');
      log('apiResults', '🇺🇸 测试英语新闻获取...', 'info');

      const result = await makeApiRequest({
        language: 'en',
        category: 'technology,science',
        size: 5
      });

      if (result.success && result.data.status === 'success') {
        log('apiResults', `✅ 英语新闻获取成功！`, 'success');
        log('apiResults', `📰 获取到 ${result.data.results.length} 条新闻`, 'success');

        result.data.results.forEach((news, index) => {
          log('apiResults', `${index + 1}. 标题: ${news.title}`, 'info');
          log('apiResults', `   语言: ${news.language || 'unknown'}`, 'info');
          log('apiResults', `   来源: ${news.source_id}`, 'info');
        });
      } else {
        log('apiResults', `❌ 英语新闻获取失败`, 'error');
        if (result.data && result.data.results) {
          log('apiResults', `错误详情: ${JSON.stringify(result.data.results)}`, 'error');
        }
      }
    }

    async function testJapaneseNews() {
      clearLog('apiResults');
      log('apiResults', '🇯🇵 测试日语新闻获取...', 'info');

      const result = await makeApiRequest({
        language: 'ja',
        category: 'technology,science',
        size: 5
      });

      log('apiResults', `📍 请求URL: ${result.url}`, 'info');

      if (result.success) {
        log('apiResults', `✅ API响应成功，状态: ${result.status}`, 'success');
        log('apiResults', `📊 响应数据: ${JSON.stringify(result.data, null, 2)}`, 'info');

        if (result.data.status === 'success' && result.data.results && result.data.results.length > 0) {
          log('apiResults', `📰 获取到 ${result.data.results.length} 条日语新闻`, 'success');

          result.data.results.forEach((news, index) => {
            log('apiResults', `${index + 1}. 标题: ${news.title}`, 'info');
            log('apiResults', `   语言: ${news.language || 'unknown'}`, 'info');
            log('apiResults', `   来源: ${news.source_id}`, 'info');
          });
        } else {
          log('apiResults', `⚠️ 日语新闻获取为空或失败`, 'error');
          log('apiResults', `返回结果数量: ${result.data.results ? result.data.results.length : 0}`, 'error');
          log('apiResults', `API状态: ${result.data.status}`, 'error');

          if (result.data.results && result.data.results.length === 0) {
            log('apiResults', `💡 可能原因: 日语新闻在指定分类中不存在`, 'error');
          }
        }
      } else {
        log('apiResults', `❌ API请求失败: ${result.error}`, 'error');
      }
    }

    async function testMixedLanguage() {
      clearLog('apiResults');
      log('apiResults', '🌐 测试混合语言 (ja,en) 新闻获取...', 'info');

      const result = await makeApiRequest({
        language: 'ja,en',
        category: 'technology,science',
        size: 10
      });

      log('apiResults', `📍 请求URL: ${result.url}`, 'info');

      if (result.success) {
        log('apiResults', `✅ API响应成功，状态: ${result.status}`, 'success');

        if (result.data.status === 'success' && result.data.results && result.data.results.length > 0) {
          log('apiResults', `📰 获取到 ${result.data.results.length} 条新闻`, 'success');

          const languageCount = {};
          result.data.results.forEach(news => {
            const lang = news.language || 'unknown';
            languageCount[lang] = (languageCount[lang] || 0) + 1;
          });

          log('apiResults', `🌐 语言分布: ${JSON.stringify(languageCount)}`, 'info');

          result.data.results.slice(0, 5).forEach((news, index) => {
            log('apiResults', `${index + 1}. [${news.language}] ${news.title}`, 'info');
          });
        } else {
          log('apiResults', `⚠️ 混合语言新闻获取为空`, 'error');
          log('apiResults', `完整响应: ${JSON.stringify(result.data, null, 2)}`, 'error');
        }
      } else {
        log('apiResults', `❌ API请求失败: ${result.error}`, 'error');
      }
    }

    async function testDifferentCategories() {
      clearLog('apiResults');
      log('apiResults', '📂 测试不同分类的日语新闻...', 'info');

      const categories = ['top', 'business', 'technology', 'science', 'health', 'sports', 'entertainment'];

      for (const category of categories) {
        log('apiResults', `\n🔍 测试分类: ${category}`, 'info');

        const result = await makeApiRequest({
          language: 'ja',
          category: category,
          size: 3
        });

        if (result.success && result.data.status === 'success') {
          const count = result.data.results ? result.data.results.length : 0;
          if (count > 0) {
            log('apiResults', `✅ ${category}: 找到 ${count} 条日语新闻`, 'success');
          } else {
            log('apiResults', `⚠️ ${category}: 未找到日语新闻`, 'error');
          }
        } else {
          log('apiResults', `❌ ${category}: API调用失败`, 'error');
        }

        // 添加小延迟避免API限制
        await new Promise(resolve => setTimeout(resolve, 500));
      }
    }

    async function testLanguageSupport() {
      clearLog('languageResults');
      log('languageResults', '🌍 测试语言支持情况...', 'info');

      const languages = ['ja', 'en', 'zh', 'ko', 'fr', 'de', 'es', 'it'];

      for (const lang of languages) {
        log('languageResults', `\n🔍 测试语言: ${lang}`, 'info');

        const result = await makeApiRequest({
          language: lang,
          size: 1
        });

        if (result.success && result.data.status === 'success') {
          const count = result.data.results ? result.data.results.length : 0;
          log('languageResults', `✅ ${lang}: ${count > 0 ? '支持' : '无新闻'}`, count > 0 ? 'success' : 'error');
        } else {
          log('languageResults', `❌ ${lang}: 不支持或出错`, 'error');
        }

        await new Promise(resolve => setTimeout(resolve, 300));
      }
    }

    async function testJapaneseCategories() {
      clearLog('languageResults');
      log('languageResults', '🇯🇵 详细测试日语各分类...', 'info');

      const categories = ['top', 'business', 'technology', 'science', 'health', 'sports', 'entertainment', 'politics', 'world'];

      for (const category of categories) {
        log('languageResults', `\n📂 日语-${category}:`, 'info');

        const result = await makeApiRequest({
          language: 'ja',
          category: category,
          size: 2
        });

        if (result.success && result.data.status === 'success') {
          const count = result.data.results ? result.data.results.length : 0;
          if (count > 0) {
            log('languageResults', `✅ 找到 ${count} 条新闻`, 'success');
            result.data.results.forEach((news, index) => {
              log('languageResults', `  ${index + 1}. ${news.title.substring(0, 50)}...`, 'info');
            });
          } else {
            log('languageResults', `⚠️ 该分类无日语新闻`, 'error');
          }
        } else {
          log('languageResults', `❌ API调用失败`, 'error');
        }

        await new Promise(resolve => setTimeout(resolve, 400));
      }
    }

    async function compareLanguageResults() {
      clearLog('analysisResults');
      log('analysisResults', '📊 对比分析语言结果...', 'info');

      const testConfigs = [
        { language: 'en', name: '英语' },
        { language: 'ja', name: '日语' },
        { language: 'ja,en', name: '日语+英语' },
        { language: 'en,ja', name: '英语+日语' }
      ];

      const results = {};

      for (const config of testConfigs) {
        log('analysisResults', `\n🔍 测试 ${config.name} (${config.language})...`, 'info');

        const result = await makeApiRequest({
          language: config.language,
          category: 'technology',
          size: 5
        });

        results[config.language] = result;

        if (result.success && result.data.status === 'success') {
          const count = result.data.results ? result.data.results.length : 0;
          log('analysisResults', `✅ ${config.name}: 获取到 ${count} 条新闻`, 'success');

          if (count > 0) {
            const languageCount = {};
            result.data.results.forEach(news => {
              const lang = news.language || 'unknown';
              languageCount[lang] = (languageCount[lang] || 0) + 1;
            });
            log('analysisResults', `   语言分布: ${JSON.stringify(languageCount)}`, 'info');
          }
        } else {
          log('analysisResults', `❌ ${config.name}: 获取失败`, 'error');
        }

        await new Promise(resolve => setTimeout(resolve, 500));
      }

      log('analysisResults', '\n📋 总结对比:', 'info');
      Object.keys(results).forEach(lang => {
        const result = results[lang];
        const count = result.success && result.data.results ? result.data.results.length : 0;
        log('analysisResults', `${lang}: ${count} 条新闻`, count > 0 ? 'success' : 'error');
      });
    }

    async function analyzeProblem() {
      clearLog('analysisResults');
      log('analysisResults', '🔍 深度分析问题原因...', 'info');

      // 1. 检查API基本功能
      log('analysisResults', '\n1️⃣ 检查API基本功能...', 'info');
      const basicTest = await makeApiRequest({ size: 1 });
      if (basicTest.success) {
        log('analysisResults', '✅ API基本功能正常', 'success');
      } else {
        log('analysisResults', '❌ API基本功能异常', 'error');
        return;
      }

      // 2. 检查日语支持
      log('analysisResults', '\n2️⃣ 检查日语支持...', 'info');
      const jaTest = await makeApiRequest({ language: 'ja', size: 1 });
      const jaNewsCount = jaTest.success && jaTest.data.results ? jaTest.data.results.length : 0;

      if (jaNewsCount > 0) {
        log('analysisResults', '✅ 日语新闻可以获取', 'success');
      } else {
        log('analysisResults', '❌ 日语新闻无法获取', 'error');

        // 3. 检查是否是分类问题
        log('analysisResults', '\n3️⃣ 检查分类支持...', 'info');
        const jaTopTest = await makeApiRequest({ language: 'ja', category: 'top', size: 1 });
        const jaTopCount = jaTopTest.success && jaTopTest.data.results ? jaTopTest.data.results.length : 0;

        if (jaTopCount > 0) {
          log('analysisResults', '💡 发现：日语在"top"分类有新闻，可能是特定分类没有日语内容', 'success');
        } else {
          log('analysisResults', '❌ 即使"top"分类也无日语新闻', 'error');
        }
      }

      // 4. 检查混合语言行为
      log('analysisResults', '\n4️⃣ 分析混合语言行为...', 'info');
      const mixedTest = await makeApiRequest({ language: 'ja,en', category: 'technology', size: 5 });
      if (mixedTest.success && mixedTest.data.results && mixedTest.data.results.length > 0) {
        const languageCount = {};
        mixedTest.data.results.forEach(news => {
          const lang = news.language || 'unknown';
          languageCount[lang] = (languageCount[lang] || 0) + 1;
        });

        log('analysisResults', `📊 混合语言结果: ${JSON.stringify(languageCount)}`, 'info');

        if (languageCount.ja) {
          log('analysisResults', '💡 混合语言模式下可以获取日语新闻', 'success');
        } else {
          log('analysisResults', '⚠️ 混合语言模式下仍无日语新闻', 'error');
        }
      }

      // 5. 给出结论
      log('analysisResults', '\n🎯 问题分析结论:', 'info');
      if (jaNewsCount === 0) {
        log('analysisResults', '💡 主要问题：NewsData.io的日语新闻内容可能有限', 'error');
        log('analysisResults', '💡 建议解决方案：', 'info');
        log('analysisResults', '  1. 使用更通用的分类如"top"', 'info');
        log('analysisResults', '  2. 实现语言降级策略', 'info');
        log('analysisResults', '  3. 考虑其他日语新闻API', 'info');
      } else {
        log('analysisResults', '✅ 日语新闻功能正常', 'success');
      }
    }
  </script>
</body>

</html>
